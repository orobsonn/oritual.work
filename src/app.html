<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d1b2a" />
		<meta name="description" content="Seu ritual diário de produtividade" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
		<link rel="shortcut icon" href="/favicon.svg?v=3" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/logo.jpg" />
		%sveltekit.head%
		<script>
			// FOUC Prevention: Apply theme before page renders
			(function() {
				const STORAGE_KEY = 'ritual-theme';
				const THEME_COLORS = { light: '#f5f7fa', dark: '#0d1b2a' };

				try {
					const stored = localStorage.getItem(STORAGE_KEY);
					const theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
					const metaThemeColor = document.querySelector('meta[name="theme-color"]');

					document.documentElement.setAttribute('data-theme', theme);
					if (metaThemeColor) metaThemeColor.content = THEME_COLORS[theme];
				} catch (e) {
					// localStorage not available, use default dark theme
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js');
			}
		</script>
	</body>
</html>
